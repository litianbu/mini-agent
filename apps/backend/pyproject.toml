[project]
name = "mini-agent-backend"
version = "0.1.0"
description = "迷你编码 agent 的后端"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.1.8",
  "aiomysql>=0.3.2",
]

[project.scripts]
mini-agent = "app.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
